baseURL = "https://reubencrimp.com/notes"
languageCode = "en-us"
googleAnalytics = "G-KK0V4Z5CSW"
pygmentsUseClasses = true
relativeURLs = true
disablePathToLower = true
ignoreFiles = [
    "/private/*",
    "/templates/*"
]
summaryLength = 20
paginate = 10
enableGitInfo = true

[markup]
    [markup.tableOfContents]
        endLevel = 3
        ordered = true
        startLevel = 2
    [markup.highlight]
        anchorLineNos = false
        codeFences = true
        guessSyntax = true
        hl_Lines = ""
        lineAnchors = ""
        lineNoStart = 1
        lineNos = true
        lineNumbersInTable = true
        style = "dracula"
        tabWidth = 4
